# Agri-market — Render Blueprint
# If Blueprint sync fails, create Postgres + Web Service manually (see README).

databases:
  - name: agri-market-db
    plan: free
    databaseName: agrimarket
    user: agrimarket

services:
  - type: web
    name: agri-market
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: Agri-market
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://agri-market.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: public
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: agri-market-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: agri-market-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: agri-market-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: agri-market-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: agri-market-db
          property: password
