services:
  postgres:
    image: postgres:16-alpine
    container_name: mkulima_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mkulimahub
      POSTGRES_USER: mkulima
      POSTGRES_PASSWORD: mkulima_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mkulima -d mkulimahub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mkulima_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./mkulimahub/backend
      dockerfile: ../../docker/Dockerfile.backend
    container_name: mkulima_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./mkulimahub/backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    ports:
      - "8000:8000"
    environment:
      APP_NAME: MkulimaHub
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: mkulimahub
      DB_USERNAME: mkulima
      DB_PASSWORD: mkulima_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,localhost:3000,127.0.0.1:5173
      FRONTEND_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "composer install --no-interaction --prefer-dist &&
             php artisan key:generate --force &&
             php artisan migrate --force &&
             php artisan db:seed --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    image: node:22-alpine
    container_name: mkulima_frontend
    working_dir: /app
    volumes:
      - ./mkulimahub/frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_vendor:
  frontend_node_modules:
